{% extends "base.html" %}

{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-custom p-5">
                <div class="mb-3">
                    <span class="display-1 fw-bold text-primary">404</span>
                </div>
                <h3 class="fw-bold text-dark mb-2">Page Not Found</h3>
                <p class="text-muted mb-4">
                    The financial resource, transaction, or page you are trying to access does not exist or may have been moved.
                </p>
                <div>
                    <a href="{{ url_for('main.index') }}" class="btn btn-primary-custom px-4 py-2">
                        <i class="bi bi-house-door me-1"></i> Return Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
